<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order tracking</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Order tracking</h1>
    <p><a href="/">Back to the shop</a></p>
    <p id="message" class="error"></p>
    <section id="order" class="card" hidden>
      <dl>
        <dt>Order</dt>
        <dd id="order-id"></dd>
        <dt>Product</dt>
        <dd id="order-product"></dd>
        <dt>Quantity</dt>
        <dd id="order-quantity"></dd>
        <dt>Created</dt>
        <dd id="order-created"></dd>
        <dt>Status</dt>
        <dd><span id="order-status" class="badge"></span></dd>
      </dl>
      <p id="connection" class="connection"></p>
    </section>
    <script src="/tracking.js"></script>
  </body>
</html>
