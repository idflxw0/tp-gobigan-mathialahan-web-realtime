<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Shop</h1>

    <h2>Products</h2>
    <table>
      <thead><tr><th>Id</th><th>Name</th><th>Stock</th></tr></thead>
      <tbody id="products"></tbody>
    </table>

    <h2>New order</h2>
    <form id="order-form">
      <select id="user" required></select>
      <select id="product" required></select>
      <input id="quantity" type="number" min="1" value="1" required />
      <button type="submit">Order</button>
    </form>
    <p id="error" class="error"></p>

    <h2>Orders</h2>
    <table>
      <thead><tr><th>Id</th><th>Product</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
    <script src="/index.js"></script>
  </body>
</html>
